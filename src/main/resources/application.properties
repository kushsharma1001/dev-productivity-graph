# Server
# Bind to the port the hosting platform injects ($PORT); default 8080 locally.
server.port=${PORT:8080}

# Neo4j connection
# Secrets come from the environment, never committed. NEO4J_PASSWORD has no
# default, so the app fails fast at startup if it is not supplied.
neo4j.uri=${NEO4J_URI:bolt+s://db-b31dd6dc.databases.cognodb.com}
neo4j.user=${NEO4J_USER:cognodb}
neo4j.password=${NEO4J_PASSWORD}
